services:
  jobtracker:
    build: .
    ports:
      - "127.0.0.1:${JOBTRACKER_PORT:-8765}:8080"
    environment:
      JOBTRACKER_CONFIG_FILE: /run/jobtracker/runtime.json
    volumes:
      - ${JOBTRACKER_DATA_PATH:-jobtracker-data}:/data
      - type: bind
        source: ${JOBTRACKER_AUTH_FILE:-./.local/jobtracker.htpasswd}
        target: /etc/nginx/auth/jobtracker.htpasswd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JOBTRACKER_RUNTIME_FILE:-./.local/runtime.json}
        target: /run/jobtracker/runtime.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  jobtracker-data:
