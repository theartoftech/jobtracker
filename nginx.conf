server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Job Tracker";
    auth_basic_user_file /etc/nginx/auth/jobtracker.htpasswd;

    add_header Cache-Control "no-store";

    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location = /api/health {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        add_header Cache-Control "no-store";
    }

    location = /calendar.ics {
        add_header Cache-Control "no-store";
        include /etc/nginx/jobtracker-calendar.conf;
    }

    location = /jobtracker/calendar.ics {
        add_header Cache-Control "no-store";
        include /etc/nginx/jobtracker-calendar.conf;
    }

    # The jobagent authenticates this machine-only route with its scoped Bearer
    # token. Basic auth is disabled here because HTTP has only one Authorization
    # header; the Python API still rejects missing or invalid import tokens.
    location = /api/analytics/workflow-runs {
        auth_basic off;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        add_header Cache-Control "no-store";
    }

    location = /jobtracker/api/analytics/workflow-runs {
        auth_basic off;
        rewrite ^/jobtracker/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        add_header Cache-Control "no-store";
    }

    location ^~ /jobtracker/api/ {
        rewrite ^/jobtracker/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        add_header Cache-Control "no-store";
    }

    location = /jobtracker {
        return 301 /jobtracker/;
    }

    location ^~ /jobtracker/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
